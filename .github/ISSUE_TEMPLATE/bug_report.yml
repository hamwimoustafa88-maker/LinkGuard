name: "🐛 Bug Report"
description: "Report a problem so we can fix it. · أبلغ عن مشكلة لنصلحها."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the sections below.
        شكراً لإبلاغك عن المشكلة! يرجى ملء الحقول التالية.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist · قائمة تحقق
      options:
        - label: I searched existing issues and this bug has not been reported yet. · بحثت ولم أجد المشكلة مطروحة.
          required: true
        - label: I am running the latest version of the `main` branch. · أستخدم أحدث نسخة من فرع main.
          required: false

  - type: textarea
    id: description
    attributes:
      label: Describe the bug · وصف المشكلة
      description: A clear and concise description of what the bug is.
      placeholder: When I scan a link, ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce · خطوات إعادة إنتاج المشكلة
      description: How can we reproduce it?
      placeholder: |
        1. Go to '...'
        2. Paste the URL '...'
        3. Click 'Scan'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior · السلوك المتوقع
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: url-sample
    attributes:
      label: Sample URL (optional) · رابط مثال (اختياري)
      description: A non-sensitive URL that triggers the issue, if relevant.
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Where did it happen? · أين حدثت المشكلة؟
      options:
        - Local development (npm run dev)
        - Production build (npm run build/start)
        - Deployed instance
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Browser, OS & extra context · المتصفح ونظام التشغيل وسياق إضافي
      description: e.g. Chrome 120 on Windows 11. Include console errors or screenshots if any.
    validations:
      required: false
